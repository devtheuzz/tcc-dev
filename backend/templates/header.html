<header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('web.home') }}" aria-label="Nexa Play, início"><img src="{{ url_for('static', filename='images/logo-stacked.png') }}" alt="Nexa Play" width="96" height="75"></a>
      <nav class="primary-nav" aria-label="Navegação principal"><a data-nav="inicio" href="{{ url_for('web.home') }}">Início</a><a data-nav="nexa-quest" href="{{ url_for('web.quest') }}">Nexa Quest</a><a data-nav="personalizar" href="{{ url_for('web.personalizar') }}">Personalizar</a><a data-nav="explorar" href="{{ url_for('web.explorar') }}">Explorar</a><a data-nav="sobre" href="{{ url_for('web.sobre') }}">Sobre</a></nav>
      <div class="account-area"><a class="button button-small" data-auth-state="guest" {% if user %}hidden{% endif %} href="{{ url_for('web.login') }}">Entrar</a><details class="profile-menu" data-auth-state="member" {% if not user %}hidden{% endif %}><summary aria-label="Abrir opções do perfil"><span data-user-initial>{{ user.nome[0]|upper if user else '' }}</span></summary><div class="profile-popover"><strong>Olá, <span data-user-name>{{ user.nome if user else '' }}</span>!</strong><a href="{{ url_for('web.quest') }}">Meu Nexa Quest</a><form method="post" action="{{ url_for('web.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Sair</button></form></div></details><button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobile-nav"><span></span><span></span><span></span></button></div>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="Navegação para celular" hidden><a data-nav="inicio" href="{{ url_for('web.home') }}">Início</a><a data-nav="nexa-quest" href="{{ url_for('web.quest') }}">Nexa Quest</a><a data-nav="personalizar" href="{{ url_for('web.personalizar') }}">Personalizar</a><a data-nav="explorar" href="{{ url_for('web.explorar') }}">Explorar</a><a data-nav="sobre" href="{{ url_for('web.sobre') }}">Sobre</a><a data-auth-state="guest" {% if user %}hidden{% endif %} href="{{ url_for('web.login') }}">Entrar</a>{% if user %}<form method="post" action="{{ url_for('web.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Sair da conta</button></form>{% endif %}</nav>
  </header>
