{% extends "base.html" %}
{% block content %}
<a class="back-link" href="{{ url_for('web.home') }}" aria-label="Voltar para o início">‹ Voltar</a>
<main id="conteudo" class="contact-layout">
    <section class="contact-intro" aria-labelledby="contact-title"><h1 id="contact-title">Fale com a<br><span>gente</span></h1><p>Tem alguma dúvida, sugestão ou precisa de ajuda? Preencha o formulário ao lado e sua mensagem ficará registrada para a equipe.</p><img src="{{ url_for('static', filename='images/contact-illustration.png') }}" alt="" width="1671" height="941" aria-hidden="true"></section>
    <form class="contact-form" id="contato-form" method="post" action="{{ url_for('web.contato') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <label for="contact-name">Seu nome <span aria-hidden="true">*</span><input id="contact-name" name="name" value="{{ request.form.get('name', '') }}" autocomplete="name" maxlength="100" placeholder="Digite seu nome" required></label>
      <label for="contact-email">Seu email <span aria-hidden="true">*</span><input id="contact-email" name="email" value="{{ request.form.get('email', '') }}" type="email" maxlength="150" autocomplete="email" placeholder="Digite seu email" required></label>
      <label for="contact-subject">Assunto <span aria-hidden="true">*</span><input id="contact-subject" name="subject" value="{{ request.form.get('subject', '') }}" maxlength="150" required></label>
      <label for="contact-message">Mensagem<textarea id="contact-message" name="message" placeholder="Escreva sua mensagem aqui..." rows="4" maxlength="5000" required>{{ request.form.get('message', '') }}</textarea></label>
      <button class="button button-large" type="submit">Enviar mensagem <span aria-hidden="true">⟶</span></button>
      <p class="form-status" id="contact-status" role="status" aria-live="polite"></p>
    </form>
  </main>
{% endblock %}
